<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro SoundCloud Player with Synced Lyrics</title>
    <style>
        /* --- CSS Variables --- */
        :root {
            --bg-color: #f4f4f9;
            --surface-color: #ffffff;
            --text-color: #333333;
            --text-muted: #888888;
            --accent-color: #ff5500;
            --accent-hover: #cc4400;
            --border-color: #dddddd;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --text-color: #e0e0e0;
            --text-muted: #666666;
            --border-color: #333333;
        }

        /* --- Global Styles --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            margin: 0; display: flex; height: 100vh; overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        button { cursor: pointer; border: none; border-radius: 4px; padding: 8px 12px; font-weight: bold; }
        .btn-primary { background-color: var(--accent-color); color: white; }
        .btn-secondary { background-color: var(--border-color); color: var(--text-color); }

        /* --- Layout --- */
        .sidebar {
            width: 250px; background-color: var(--surface-color); border-right: 1px solid var(--border-color);
            padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; z-index: 10;
        }

        .main-content {
            flex-grow: 1; padding: 20px; overflow-y: auto; padding-bottom: 120px; position: relative;
        }

        .nav-item { padding: 10px; border-radius: 4px; cursor: pointer; }
        .nav-item:hover { background-color: var(--border-color); }

        /* --- UI Elements --- */
        .search-bar {
            width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px;
            background-color: var(--surface-color); color: var(--text-color); margin-bottom: 20px; box-sizing: border-box;
        }

        .track-item {
            background-color: var(--surface-color); padding: 15px; border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-color); margin-bottom: 10px;
        }

        /* --- Expanded Player UI --- */
        .expanded-view {
            position: absolute; top: 100%; left: 0; width: 100%; height: calc(100% - 90px);
            background-color: var(--bg-color); z-index: 5; transition: top 0.4s ease-in-out;
            display: flex; padding: 40px; box-sizing: border-box; gap: 40px;
        }
        .expanded-view.active { top: 0; }

        .cover-art-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        #cover-art { width: 300px; height: 300px; border-radius: 12px; object-fit: cover; box-shadow: 0 10px 30px rgba(0,0,0,0.3); background-color: var(--border-color); margin-bottom: 20px; }
        
        .censor-toggle { display: flex; align-items: center; gap: 10px; margin-top: 15px; background: var(--surface-color); padding: 10px 15px; border-radius: 20px; border: 1px solid var(--border-color); }
        .censor-toggle input { cursor: pointer; }

        /* --- Synced Lyrics --- */
        .lyrics-container { 
            flex: 1; overflow-y: auto; padding-right: 20px; font-size: 1.5em; 
            line-height: 1.8; font-weight: bold; scroll-behavior: smooth;
            -ms-overflow-style: none; scrollbar-width: none;
        }
        .lyrics-container::-webkit-scrollbar { display: none; }

        .lyric-line { color: var(--text-muted); transition: color 0.3s, transform 0.3s; margin-bottom: 15px; transform-origin: left; cursor: pointer; }
        .lyric-line.active { color: var(--text-color); transform: scale(1.05); }

        /* --- Bottom Player Bar --- */
        .player-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; background-color: var(--surface-color);
            border-top: 1px solid var(--border-color); padding: 15px 20px; display: flex; align-items: center;
            justify-content: space-between; box-sizing: border-box; z-index: 20;
        }
        .now-playing { display: flex; align-items: center; gap: 15px; width: 300px; }
        .now-playing img { width: 50px; height: 50px; border-radius: 4px; background-color: var(--border-color); object-fit: cover; }
        .now-playing div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        #sc-widget { display: none; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>MyMusic Pro</h2>
        <button id="theme-toggle" class="btn-secondary">Toggle Theme</button>
        <hr style="width: 100%; border-color: var(--border-color);">
        <div class="nav-item" onclick="renderView('home')">🏠 Home / All Tracks</div>
        <hr style="width: 100%; border-color: var(--border-color);">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3>Playlists</h3>
            <button class="btn-secondary" onclick="createPlaylist()" style="padding: 2px 8px;">+</button>
        </div>
        <div id="playlist-nav"></div>
    </div>

    <div class="main-content">
        <input type="text" id="search-input" class="search-bar" placeholder="Search tracks or artists...">

        <div id="expanded-view" class="expanded-view">
            <div class="cover-art-container">
                <img id="cover-art" src="" alt="Album Art">
                <h2 id="expanded-title" style="margin-bottom: 5px;">No track playing</h2>
                <p id="expanded-artist" style="color: var(--accent-color); margin-top: 0;"></p>
                
                <div class="censor-toggle">
                    <input type="checkbox" id="censor-checkbox">
                    <label for="censor-checkbox">Censor Explicit Lyrics</label>
                </div>
            </div>
            <div class="lyrics-container" id="lyrics-box">
                Play a song to load lyrics...
            </div>
        </div>

        <h2 id="view-title">All Tracks</h2>
        <div id="content-area"></div>
    </div>

    <div class="player-bar">
        <div class="now-playing">
            <img id="mini-cover" src="" alt="">
            <div>
                <strong id="now-playing-title">No track playing</strong><br>
                <small id="now-playing-artist"></small>
            </div>
        </div>
        <div class="controls">
            <button id="btn-play" class="btn-primary">Play</button>
            <button id="btn-pause" class="btn-secondary">Pause</button>
            <button id="btn-expand" class="btn-secondary">⛶ Expand</button>
        </div>
    </div>

    <iframe id="sc-widget" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/293&auto_play=false"></iframe>
    <script src="https://w.soundcloud.com/player/api.js"></script>

    <script>
        // --- 1. App State & Init ---
        let currentWidget = null;
        let isExpanded = false;
        let parsedLyrics = [];
        let currentLyricIndex = -1;
        let isCensoring = false;

        // Expanded Swear Dictionary
        const badWords = ['fuck', 'fucking', 'motherfucker', 'shit', 'bullshit', 'bitch', 'ass', 'asshole', 'damn', 'crap', 'whore', 'slut'];
        // More aggressive regex to catch punctuation around words
        const censorRegex = new RegExp("\\b(" + badWords.join("|") + ")\\b", "gi");

        // Updated track list to use standard, valid SoundCloud URLs so playback actually works
        const trackDatabase = [
            { id: 1, title: "Creep", artist: "Radiohead", url: "https://soundcloud.com/radiohead/creep" }, 
            { id: 2, title: "Bohemian Rhapsody", artist: "Queen", url: "https://soundcloud.com/queen-69312/bohemian-rhapsody" },
            { id: 3, title: "Never Gonna Give You Up", artist: "Rick Astley", url: "https://soundcloud.com/rick-astley-official/never-gonna-give-you-up-4" }
        ];
        let playlists = { "Favorites": [] };

        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            renderPlaylistNav();
            renderView('home');

            currentWidget = SC.Widget(document.getElementById('sc-widget'));

            document.getElementById('btn-play').addEventListener('click', () => currentWidget.play());
            document.getElementById('btn-pause').addEventListener('click', () => currentWidget.pause());
            
            document.getElementById('btn-expand').addEventListener('click', () => {
                isExpanded = !isExpanded;
                document.getElementById('expanded-view').classList.toggle('active');
                document.getElementById('btn-expand').innerText = isExpanded ? "▼ Collapse" : "⛶ Expand";
            });

            document.getElementById('censor-checkbox').addEventListener('change', (e) => {
                isCensoring = e.target.checked;
                renderLyricsToScreen(); // Instantly update text on screen
            });

            // Re-bind the search input
            document.getElementById('search-input').addEventListener('input', handleSearch);

            currentWidget.bind(SC.Widget.Events.PLAY_PROGRESS, handlePlaybackProgress);
        });

        // --- 2. Playback & Artwork (FIXED) ---
        function playTrack(scUrl, title, artist) {
            document.getElementById('now-playing-title').innerText = title;
            document.getElementById('now-playing-artist').innerText = artist;
            document.getElementById('expanded-title').innerText = title;
            document.getElementById('expanded-artist').innerText = artist;
            
            // FIX: Use the callback to fetch artwork immediately on load, and force play
            currentWidget.load(scUrl, { 
                auto_play: true,
                callback: () => {
                    fetchArtwork();
                    currentWidget.play(); // Force browser to play
                }
            });
            
            fetchRealLyrics(title, artist);
        }

        function fetchArtwork() {
            currentWidget.getCurrentSound(function(sound) {
                if (sound && sound.artwork_url) {
                    const hiResArt = sound.artwork_url.replace('-large', '-t500x500');
                    document.getElementById('cover-art').src = hiResArt;
                    document.getElementById('mini-cover').src = sound.artwork_url;
                }
            });
        }

        // --- 3. Search Logic (RESTORED) ---
        function handleSearch(e) {
            const query = e.target.value.toLowerCase();
            if (query === '') {
                renderView('home');
                return;
            }
            const results = trackDatabase.filter(track => 
                track.title.toLowerCase().includes(query) || 
                track.artist.toLowerCase().includes(query)
            );
            renderView('search', results);
        }

        // --- 4. Lyrics Fetching & Syncing (LRCLIB API) ---
        async function fetchRealLyrics(title, artist) {
            const lyricsBox = document.getElementById('lyrics-box');
            lyricsBox.innerHTML = "Searching for lyrics...";
            parsedLyrics = [];
            currentLyricIndex = -1;

            try {
                const url = `https://lrclib.net/api/get?track_name=${encodeURIComponent(title)}&artist_name=${encodeURIComponent(artist)}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Lyrics not found');
                
                const data = await response.json();
                
                if (data.syncedLyrics) {
                    parseLRC(data.syncedLyrics);
                    renderLyricsToScreen();
                } else if (data.plainLyrics) {
                    lyricsBox.innerHTML = applyCensorship(data.plainLyrics).replace(/\n/g, '<br><br>');
                } else {
                    lyricsBox.innerHTML = "Instrumental or no lyrics available.";
                }
            } catch (error) {
                lyricsBox.innerHTML = "Could not find lyrics for this track in the open database.";
            }
        }

        function parseLRC(lrcString) {
            const lines = lrcString.split('\n');
            const timeRegex = /\[(\d{2}):(\d{2}\.\d{2,3})\](.*)/;
            
            lines.forEach(line => {
                const match = line.match(timeRegex);
                if (match) {
                    const minutes = parseInt(match[1], 10);
                    const seconds = parseFloat(match[2]);
                    const text = match[3].trim();
                    if (text) parsedLyrics.push({ time: (minutes * 60) + seconds, text: text });
                }
            });
        }

        function renderLyricsToScreen() {
            const lyricsBox = document.getElementById('lyrics-box');
            lyricsBox.innerHTML = '';
            if (parsedLyrics.length === 0) return;

            parsedLyrics.forEach((lyricObj, index) => {
                const div = document.createElement('div');
                div.className = 'lyric-line';
                div.id = `lyric-${index}`;
                div.innerText = applyCensorship(lyricObj.text);
                
                div.onclick = () => currentWidget.seekTo(lyricObj.time * 1000); 
                lyricsBox.appendChild(div);
            });
        }

        function handlePlaybackProgress(event) {
            if (parsedLyrics.length === 0) return;
            const currentSeconds = event.currentPosition / 1000;
            let activeIndex = -1;

            for (let i = 0; i < parsedLyrics.length; i++) {
                if (currentSeconds >= parsedLyrics[i].time) activeIndex = i;
                else break;
            }

            if (activeIndex !== -1 && activeIndex !== currentLyricIndex) {
                if (currentLyricIndex !== -1) {
                    const oldEl = document.getElementById(`lyric-${currentLyricIndex}`);
                    if (oldEl) oldEl.classList.remove('active');
                }
                const newEl = document.getElementById(`lyric-${activeIndex}`);
                if (newEl) {
                    newEl.classList.add('active');
                    newEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                currentLyricIndex = activeIndex;
            }
        }

        // --- 5. Censorship Engine (FIXED) ---
        function applyCensorship(text) {
            if (!isCensoring) return text;
            return text.replace(censorRegex, match => '*'.repeat(match.length));
        }

        // --- 6. Playlists & Views ---
        function initTheme() {
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (prefersDark) document.body.setAttribute('data-theme', 'dark');
            document.getElementById('theme-toggle').addEventListener('click', () => {
                const isDark = document.body.getAttribute('data-theme') === 'dark';
                document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            });
        }

        function createPlaylist() {
            const name = prompt("Enter playlist name:");
            if (name && !playlists[name]) { playlists[name] = []; renderPlaylistNav(); }
        }

        function renderPlaylistNav() {
            const nav = document.getElementById('playlist-nav');
            nav.innerHTML = '';
            for (let listName in playlists) {
                const div = document.createElement('div');
                div.className = 'nav-item';
                div.innerText = `🎵 ${listName}`;
                div.onclick = () => renderView('playlist', listName);
                nav.appendChild(div);
            }
        }

        function addToPlaylist(trackId) {
            const playlistNames = Object.keys(playlists);
            if (playlistNames.length === 0) return alert("Create a playlist first!");
            const listName = prompt(`Add to which playlist? \n(${playlistNames.join(', ')})`, playlistNames[0]);
            if (playlists[listName]) {
                const track = trackDatabase.find(t => t.id === trackId);
                if (!playlists[listName].find(t => t.id === trackId)) {
                    playlists[listName].push(track); alert(`Added to ${listName}`);
                } else { alert("Already in this playlist."); }
            }
        }

        function renderView(viewType, filterData = null) {
            const contentArea = document.getElementById('content-area');
            const viewTitle = document.getElementById('view-title');
            contentArea.innerHTML = '';
            
            let tracks = [];
            if (viewType === 'home') { viewTitle.innerText = "All Tracks"; tracks = trackDatabase; }
            if (viewType === 'playlist') { viewTitle.innerText = filterData; tracks = playlists[filterData]; }
            if (viewType === 'search') { viewTitle.innerText = "Search Results"; tracks = filterData; }

            if (tracks.length === 0) return contentArea.innerHTML = '<p>No tracks found.</p>';

            tracks.forEach(track => {
                const div = document.createElement('div'); div.className = 'track-item';
                div.innerHTML = `
                    <div><h4>${track.title}</h4><p style="margin:0; font-size:0.9em;">${track.artist}</p></div>
                    <div>
                        <button class="btn-primary" onclick="playTrack('${track.url}', '${track.title}', '${track.artist}')">Play</button>
                        <button class="btn-secondary" onclick="addToPlaylist(${track.id})">+</button>
                    </div>`;
                contentArea.appendChild(div);
            });
        }
    </script>
</body>
</html>
